<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Note</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 16px; font-size: 14px; }
    input, button { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; margin-top: 6px; }
    button { margin-top: 24px; cursor: pointer; }
    #status { margin-top: 16px; }
  </style>
</head>
<body>
  <a href="index.html">← Back</a>
  <h1>Add note</h1>

  <label>GitHub repo (owner/name)
    <input id="repo" value="23f2004336/my-notes">
  </label>
  <label>GitHub token (saved in this browser only)
    <input id="token" type="password">
  </label>
  <label>Subject
    <input id="subject" list="subjects" placeholder="e.g. deep-learning">
    <datalist id="subjects"></datalist>
  </label>
  <label>File (.html or .pdf)
    <input id="file" type="file" accept=".html,.pdf" multiple>
  </label>
  <button id="go">Upload</button>
  <div id="status"></div>

  <script>
    const $ = id => document.getElementById(id);
    $("token").value = localStorage.getItem("gh_token") || "";
    $("repo").value = localStorage.getItem("gh_repo") || $("repo").value;

    fetch("notes.json").then(r => r.json()).then(d => {
      $("subjects").innerHTML = Object.keys(d)
        .map(s => `<option value="${s.toLowerCase().replace(/ /g, "-")}">`).join("");
    });

    const slug = s => s.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const toB64 = f => new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(",")[1]);
      r.onerror = rej;
      r.readAsDataURL(f);
    });

    $("go").onclick = async () => {
      const repo = $("repo").value.trim(), token = $("token").value.trim();
      const subject = slug($("subject").value), files = [...$("file").files];
      if (!repo || !token || !subject || !files.length) {
        $("status").textContent = "Fill everything in.";
        return;
      }
      localStorage.setItem("gh_token", token);
      localStorage.setItem("gh_repo", repo);
      $("status").textContent = "Uploading...";

      try {
        for (const f of files) {
          const name = f.name.toLowerCase().replace(/\s+/g, "-");
          const url = `https://api.github.com/repos/${repo}/contents/notes/${subject}/${name}`;
          const headers = { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" };

          let sha;
          const existing = await fetch(url, { headers });
          if (existing.ok) sha = (await existing.json()).sha;

          const res = await fetch(url, {
            method: "PUT",
            headers,
            body: JSON.stringify({ message: `add ${subject}/${name}`, content: await toB64(f), sha })
          });
          if (!res.ok) throw new Error((await res.json()).message);
        }
        $("status").textContent = "Done! The list updates in about a minute.";
      } catch (e) {
        $("status").textContent = "Failed: " + e.message;
      }
    };
  </script>
</body>
</html>
